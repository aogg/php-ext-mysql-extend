name: build

# Trigger scope:
#   - push to main          -> 12 builds (Actions Artifacts) + `latest` job
#   - push of a v* tag      -> 12 builds (Actions Artifacts) + version `release` job
#   - pull_request          -> 12 builds only
#   - workflow_dispatch     -> 12 builds only
# The `latest` tag this workflow itself pushes does NOT match `v*` and is not a
# branch push, so it does not start another build/release cycle. (Tag pushes
# made with the workflow's GITHUB_TOKEN never trigger workflows anyway.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: php ${{ matrix.php }} / ${{ matrix.libc }} / x86_64 nts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
        libc: ["glibc", "musl"]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve container image
        run: |
          set -eu
          if [ "${{ matrix.libc }}" = "musl" ]; then
            image="php:${{ matrix.php }}-cli-alpine"
          else
            image="php:${{ matrix.php }}-cli"
          fi
          echo "MRE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "using image: $image"

      - name: Pull image and show PHP
        run: |
          set -eu
          docker pull "$MRE_IMAGE"
          docker run --rm "$MRE_IMAGE" php -v
          docker run --rm "$MRE_IMAGE" php -i | grep -E '^(PHP API|Thread Safety) =>'

      # The repository is mounted read-only at /src; the container copies it to
      # /tmp/src and builds there, so nothing (configure/Makefile/modules) is
      # written back into the checkout. All build logic lives in
      # .github/scripts/build-mre.sh so it can be reproduced locally:
      #   docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" \
      #     -e MRE_PHP_SERIES=7.4 -e MRE_LIBC=musl php:7.4-cli-alpine \
      #     sh -c 'cp -a /src /tmp/src && sh /tmp/src/.github/scripts/build-mre.sh /tmp/src /out'
      - name: Build, smoke test and package (inside container)
        run: |
          set -eu
          out="$RUNNER_TEMP/mre-out"
          mkdir -p "$out"
          docker run --rm \
            --name "temp-mre-${{ matrix.php }}-${{ matrix.libc }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$out:/out" \
            -e "MRE_PHP_SERIES=${{ matrix.php }}" \
            -e "MRE_LIBC=${{ matrix.libc }}" \
            -e "MRE_GIT_SHA=$GITHUB_SHA" \
            -e "MRE_GIT_REF=$GITHUB_REF" \
            "$MRE_IMAGE" \
            sh -c 'cp -a /src /tmp/src && sh /tmp/src/.github/scripts/build-mre.sh /tmp/src /out'

      - name: Verify packaged artifacts
        run: |
          set -eu
          base="mre-${{ matrix.php }}-${{ matrix.libc }}-x86_64-nts"
          out="$RUNNER_TEMP/mre-out"
          test -f "$out/$base.so"
          test -f "$out/$base.so.sha256"
          test -f "$out/$base.tar.gz"
          test -f "$out/BUILD-INFO"
          ( cd "$out" && sha256sum -c "$base.so.sha256" )
          # the BUILD-INFO must describe the matrix entry this job built
          grep -qx "php_series=${{ matrix.php }}" "$out/BUILD-INFO"
          grep -qx "libc=${{ matrix.libc }}" "$out/BUILD-INFO"
          grep -qx "php_zts=nts" "$out/BUILD-INFO"
          cat "$out/BUILD-INFO"
          tar -tzf "$out/$base.tar.gz"
          file "$out/$base.so"

      # Every build job produces a file literally called BUILD-INFO, and the
      # publish jobs merge all artifacts into one directory (merge-multiple),
      # where those copies would overwrite each other. Rename it to a
      # matrix-unique name after the verification above; the .tar.gz keeps
      # BUILD-INFO under its original name, so build-mre.sh stays untouched.
      - name: Rename BUILD-INFO to a matrix-unique name
        run: |
          set -eu
          out="$RUNNER_TEMP/mre-out"
          info="BUILD-INFO-${{ matrix.php }}-${{ matrix.libc }}.txt"
          mv "$out/BUILD-INFO" "$out/$info"
          test -f "$out/$info"
          echo "--- $info ---" && cat "$out/$info"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-${{ matrix.php }}-${{ matrix.libc }}-x86_64-nts
          path: |
            ${{ runner.temp }}/mre-out/mre-${{ matrix.php }}-${{ matrix.libc }}-x86_64-nts.so
            ${{ runner.temp }}/mre-out/mre-${{ matrix.php }}-${{ matrix.libc }}-x86_64-nts.so.sha256
            ${{ runner.temp }}/mre-out/BUILD-INFO-${{ matrix.php }}-${{ matrix.libc }}.txt
            ${{ runner.temp }}/mre-out/mre-${{ matrix.php }}-${{ matrix.libc }}-x86_64-nts.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Rolling "latest" publishing — every push to main.
  #
  # After all 12 builds succeed (`needs: build`; one failure keeps this job from
  # running), this job moves the permanent `latest` tag to the pushed commit and
  # replaces the assets of the `latest` GitHub Release with the fresh 12 packages.
  # Version releases stay opt-in: push a v* tag to freeze a version.
  # ---------------------------------------------------------------------------
  latest:
    name: publish latest (rolling)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # force-move the latest tag + create/update the Release
      actions: read     # read the artifacts produced by this same run

    steps:
      # Needed both for the repository-local verify script and for `git push`
      # of the force-moved tag (checkout persists the job token credentials).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download every build artifact into one directory
        uses: actions/download-artifact@v4
        with:
          pattern: mre-*
          path: release
          merge-multiple: true

      - name: Merge checksums and verify all 12 packages
        run: sh .github/scripts/verify-release-assets.sh release

      # The tag is moved only after the assets passed verification, so a broken
      # build can never re-point `latest` at unusable artifacts. `contents:
      # write` above authorises the push; no PAT is involved.
      - name: Force-move the latest tag to the built commit
        run: |
          set -eu
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Create or update the latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: mre latest
          body: |
            mre（mysql-redis-extend）PHP 扩展的**滚动最新**预编译产物。

            本 Release 由 CI 永久维护：每次向 `main` 推送、12 个构建 job 全部成功后，
            自动把 `latest` 标签移动到该提交，并整体替换本 Release 的 49 个资产。
            不需要每次打不同的版本标签；想冻结某一版时再推 `v*` 标签发版本 Release。

            - commit：${{ github.sha }}
            - 构建运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 触发：`${{ github.ref }}`（${{ github.event_name }}）

            ## 选择哪个包

            - **Alpine / musl 环境**：`mre-<php>-musl-x86_64-nts.so`（或同名 `.tar.gz`）
            - **Debian / Ubuntu / glibc 环境**：`mre-<php>-glibc-x86_64-nts.so`（或同名 `.tar.gz`）
            - `<php>` 必须与本机 PHP **主次版本完全一致**（Zend API 不同，`.so` 不能跨版本混用）
            - 每个环境具体的 glibc/musl 版本、PHP API 号、编译器与 git sha，
              见对应的 `BUILD-INFO-<php>-<libc>.txt`

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS                          # 全量 12 份
            sha256sum -c mre-8.3-musl-x86_64-nts.so.sha256   # 单个
            ```

            ## 安装

            ```ini
            ; php.ini —— mysqlnd 为独立 .so 的发行版必须先加载它
            extension=mysqlnd.so
            extension=mre.so
            ```

            ```bash
            php -m | grep mre
            php -i | grep -A 14 '^mre$'
            ```

            `.tar.gz` 内含 `.so`、`.so.sha256` 与 `BUILD-INFO`（保持原文件名，随包追溯构建环境）。
          files: |
            release/*.so
            release/*.so.sha256
            release/*.tar.gz
            release/BUILD-INFO-*.txt
            release/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  # ---------------------------------------------------------------------------
  # Version releases — v* tag pushes only (v0.2.0 style). Kept fully independent
  # from the rolling `latest` job above: a v* tag publishes that tag, branch
  # pushes never publish here. `needs: build` means one failing build keeps this
  # job from running at all.
  # ---------------------------------------------------------------------------
  release:
    name: publish release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create/update the GitHub Release and upload assets
      actions: read     # read the artifacts produced by this same run

    steps:
      # The verify logic is shared with the `latest` job; checking out the built
      # ref makes .github/scripts/verify-release-assets.sh available here.
      - uses: actions/checkout@v4

      - name: Download every build artifact into one directory
        uses: actions/download-artifact@v4
        with:
          pattern: mre-*
          path: release
          merge-multiple: true

      - name: Merge checksums and verify all 12 packages
        run: sh .github/scripts/verify-release-assets.sh release

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mre ${{ github.ref_name }}
          body: |
            mre（mysql-redis-extend）PHP 扩展的预编译模块，12 份矩阵产物：
            PHP 7.4/8.0/8.1/8.2/8.3/8.4 × glibc/musl，x86_64、NTS。

            ## 选择哪个包

            - **Alpine / musl 环境**：`mre-<php>-musl-x86_64-nts.so`（或同名 `.tar.gz`）
            - **Debian / Ubuntu / glibc 环境**：`mre-<php>-glibc-x86_64-nts.so`（或同名 `.tar.gz`）
            - `<php>` 必须与本机 PHP **主次版本完全一致**（Zend API 不同，`.so` 不能跨版本混用）
            - 每个环境具体的 glibc/musl 版本、PHP API 号、编译器与 git sha，
              见对应的 `BUILD-INFO-<php>-<libc>.txt`

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS                          # 全量 12 份
            sha256sum -c mre-8.3-musl-x86_64-nts.so.sha256   # 单个
            ```

            ## 安装

            ```ini
            ; php.ini —— mysqlnd 为独立 .so 的发行版必须先加载它
            extension=mysqlnd.so
            extension=mre.so
            ```

            ```bash
            php -m | grep mre
            php -i | grep -A 14 '^mre$'
            ```

            `.tar.gz` 内含 `.so`、`.so.sha256` 与 `BUILD-INFO`（保持原文件名，随包追溯构建环境）。
          files: |
            release/*.so
            release/*.so.sha256
            release/*.tar.gz
            release/BUILD-INFO-*.txt
            release/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
